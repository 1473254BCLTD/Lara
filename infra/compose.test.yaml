name: lara-test

services:
  postgres:
    image: postgres:18

    # Test credentials are completely separate
    # from development credentials.
    env_file:
      - ./.env.test

    environment:
      POSTGRES_USER: lara
      POSTGRES_DB: lara_test

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      MIGRATION_DATABASE_PASSWORD: ${MIGRATION_DATABASE_PASSWORD:?MIGRATION_DATABASE_PASSWORD is required}

    # Use a separate localhost port.
    # Development PostgreSQL continues using 5432.
    ports:
      - "127.0.0.1:5433:5432"

    # Dedicated test storage.
    # Never share the development PostgreSQL volume.
    volumes:
      - postgres_test_data:/var/lib/postgresql
      - ./postgres/init/01-create-roles.sh:/docker-entrypoint-initdb.d/01-create-roles.sh:ro
      - ./test/postgres/init/02-mark-test-database.sh:/docker-entrypoint-initdb.d/02-mark-test-database.sh:ro

    # Verify PostgreSQL is accepting connections.
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

    # Test infrastructure should not automatically restart.
    restart: "no"

volumes:
  postgres_test_data:
